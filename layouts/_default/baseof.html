<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  {{ $css := resources.Get "css/style.css" | resources.Minify }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    <p class="site-desc">{{ .Site.Params.description }}</p>
    <nav class="site-nav">
      <a href="{{ "/" | relURL }}">全部</a>
      <a href="{{ "/categories/" | relURL }}">分类</a>
      <a href="{{ "/timeline/" | relURL }}">时间线</a>
    </nav>
  </header>
  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <p>共记录 {{ len (where .Site.RegularPages "Section" "items") }} 件物品 · Powered by Hugo</p>
  </footer>
</body>
</html>
